name: CI
on:
  push:
  pull_request:

env:
  CORESTONE_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/corestone_test?sslmode=disable

jobs:
  backend:
    name: Backend (vet, fmt, race tests, fuzz smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corestone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt gate
        run: test -z "$(gofmt -l .)"
      - name: Unit and integration tests (race detector, PostgreSQL projection)
        run: go test -race -count=1 ./...
      - name: Fuzz smoke
        run: |
          go test -run xxx -fuzz FuzzRoundTrip   -fuzztime 20s ./internal/ojson/
          go test -run xxx -fuzz FuzzCleanFolder -fuzztime 20s ./internal/model/
          go test -run xxx -fuzz FuzzClassify    -fuzztime 20s ./internal/scanner/

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: End to end (REST script + Playwright UI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corestone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web client and server
        run: |
          cd web && npm ci --no-audit --no-fund && npm run build && cd ..
          go build -o bin/corestone ./cmd/corestone
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Install Playwright browser
        run: cd web && npx playwright install --with-deps chromium
      - name: Create the database for the temporary servers
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE corestone_e2e'
      - name: REST end-to-end
        run: make e2e
      - name: Playwright UI tests (all suites)
        run: make test-ui-all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and check that it starts
        run: |
          docker build --build-arg VERSION=${GITHUB_SHA::7} -t corestone:ci .
          docker run --rm corestone:ci -version
