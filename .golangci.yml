version: "2"

linters:
  default: standard
  enable:
    - rowserrcheck # a cancelled query must never yield a silently truncated result
  settings:
    errcheck:
      # Idiomatic deferred cleanup whose error carries no information.
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Conn).Close
        - (*os.File).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*github.com/coder/websocket.Conn).CloseNow
        - (*github.com/thomdehoog/corestone/internal/projection.DB).Close
        - (*github.com/thomdehoog/corestone/internal/foundation.Foundation).Close
        - os.Remove
        - (io.Writer).Write
        - (hash.Hash).Write
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint

formatters:
  enable:
    - gofmt
